name: Build & Deploy

on:
  schedule:
    - cron: '*/5 * * * *'   # every 5 min — fetchData.mjs decides internally what to call

  push:
    branches: [main]

  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout main (source code)
        uses: actions/checkout@v4
        with:
          ref: main
          path: main

      - name: Checkout gh-pages (persisted state + live data)
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages
          fetch-depth: 1
        # If gh-pages doesn't exist yet on first run, continue anyway
        continue-on-error: true

      - name: Restore api-state.json and live.json from gh-pages
        run: |
          mkdir -p main/public
          if [ -f gh-pages/api-state.json ]; then
            cp gh-pages/api-state.json main/public/api-state.json
            echo "Restored api-state.json"
          fi
          if [ -f gh-pages/live.json ]; then
            cp gh-pages/live.json main/public/live.json
            echo "Restored live.json"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: main
        run: npm install

      - name: Fetch live data (smart — respects budget)
        working-directory: main
        env:
          WC_API_KEY: ${{ secrets.WC_API_KEY }}
        run: npm run fetch-data

      - name: Build Vite app
        working-directory: main
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./main/dist
          force_orphan: true
          commit_message: 'deploy'
