name: Publish App

on:
  # Also runs on every push to main (e.g. code changes)
  push:
    branches: [main]

  # Allows manual trigger from the Actions tab
  workflow_dispatch:

jobs:
  publish-app:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to push to gh-pages branch

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

#      - name: Setup Node.js
#        uses: actions/setup-node@v4
#        with:
#          node-version: '22'

#      - name: Install dependencies
#        run: npm install

#      - name: Build Vite app
#        run: npm run build
#        # The build picks up public/live.json automatically

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true        # ← replaces gh-pages branch instead of appending commits
          commit_message: 'deploy'  # single generic message, history never grows
